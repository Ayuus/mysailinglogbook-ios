flatpak_sdk = "org.gnome.Sdk"

[tool.briefcase.app.mysailinglogbook.windows]
requires = [
    "toga-winforms~=0.5.0",
]

# Mobile deployments
[tool.briefcase.app.mysailinglogbook.iOS]
# Xcode 27's simulator/device toolchain refuses anything below 15.0 (found in
# practice: Xcode 27 on a fresh Mac mini rejected the briefcase iOS template's own
# default of 13.0 outright -- "supported deployment target versions is 15.0 to
# 27.0.x"). Raise, not just silence the error: nothing in this app needs anything
# between 13.0 and 15.0 anyway.
min_os_version = "15.0"

# Absolute path, machine-specific -- same reasoning as the Android app's own
# local.properties (nmea2log.src.dir), just no equivalent git-ignored override file
# here yet since there is only one machine this has ever been built on so far.
# Revisit (an env var, or a local, git-ignored override) before a second machine
# or CI needs to build this.
requires = [
    "toga-iOS~=0.5.0",
    "nmea2log @ file:///Users/m1/Github/nmea2log",
]

# UIBackgroundModes processing + BGTaskSchedulerPermittedIdentifiers: the boat mode's background rounds (see
# boot_mode_controller.py) run as a BGProcessingTask when iOS decides to; NSLocalNetworkUsageDescription: the text of
# the "find devices on your local network" question for reaching the W2K-2.
#
# Exposes the app's Documents folder (where ebl_dir() puts the .ebl archive -- see its own doc
# comment) to the Files app and Finder-over-USB, matching Android's own getExternalFilesDir()
# being USB-browsable (EblStorage.kt's own reasoning for using that instead of internal
# storage). Without this, that comment's own claim ("reachable from the Files app / Finder over
# USB") wasn't actually true -- found in practice, asked for explicitly to fix: the folder
# existed but neither the Files app nor Finder ever showed it without this key.
info = { "UIFileSharingEnabled" = true, "LSSupportsOpeningDocumentsInPlace" = true, "UIBackgroundModes" = ["processing"], "BGTaskSchedulerPermittedIdentifiers" = ["com.ayuus.mysailinglogbook.boatmode"], "NSLocalNetworkUsageDescription" = "Om de W2K-2 op het boordnetwerk te vinden en de logbestanden op te halen." }

